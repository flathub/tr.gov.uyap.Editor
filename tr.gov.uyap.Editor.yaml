id: tr.gov.uyap.Editor
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: '26.08'
command: uyapeditor
rename-icon: uyap-editor
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk11

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pcsc
  - --socket=cups
  - --device=dri
  - --filesystem=xdg-documents
  - --persist=.
  - --env=JAVA_HOME=/app/jre

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk11/install.sh

  - name: uyapeditor
    buildsystem: simple
    build-commands:
      - mkdir /app/bin
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.Template.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - find . -name "uyapeditor_*_amd64.deb" -exec ar x {} ";"
      - find . -name "data.tar.*" -exec tar -xf {} ";"
      - cp -r usr/share/* /app/share/
      # İki dosyanın dosya yollarını Flatpak için uyumla
      - sed -i 's/\/usr\/share/\/app\/share/g' /app/share/UYAPEditor/dokuman.sh
      - sed -i 's/\/usr\/share/\/app\/share/g' /app/share/UYAPEditor/sablon.sh
      # udf dosya uzantılarını Flatpak kimliğiyle uyumla
      - mv /app/share/mime/packages/udf.xml /app/share/mime/packages/${FLATPAK_ID}.udf.xml
      # Oluşturulan dosyaların generic-icon/simge değerlerini Flatpak kimliğiyle uyumla
      - sed -i 's/name="uyap-editor"/name="tr.gov.uyap.Editor"/g' /app/share/mime/packages/${FLATPAK_ID}.udf.xml
      - ln -s /app/jre/bin/java /app/bin/java
      - ln -s /app/share/UYAPEditor/dokuman.sh /app/bin/uyapeditor
      - ln -s /app/share/UYAPEditor/sablon.sh /app/bin/uyapsablon
    sources:
      - type: archive
        url: https://rayp.adalet.gov.tr/resimler/2/dosya/uyapeditor_5.4.20_amd64.zip
        sha256: 5a31393af180723c8dff1e88e58c34ba5a5f85e43c197d0e05048de3b96a059f
        x-checker-data:
          type: html
          url: https://uyap.gov.tr/UYAP-Editor
          # upstream renames the file on a whim (5.4.16: uyap-pardus-5-4-16-amd64<date>.zip,
          # 5.4.17: uyapeditor-5417-amd64<date>.zip, 5.4.20: uyapeditor_5.4.20_amd64.zip);
          # prefix/separator variants are tolerated, but the version MUST be dotted:
          # capturing "5417" or "5-4-16" would poison the checker's version comparison
          pattern: (//rayp\.adalet\.gov\.tr/resimler/2/dosya/uyap[-_]?(?:editor|pardus)[-_](\d+(?:\.\d+)+)[-_]amd64[^"'\s<>]*\.zip)
      - type: file
        path: platform/tr.gov.uyap.Editor.desktop
      - type: file
        path: platform/tr.gov.uyap.Editor.Template.desktop
      - type: file
        path: platform/tr.gov.uyap.Editor.metainfo.xml
